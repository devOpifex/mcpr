url: https://mcpr.opifex.org
template:
  bootstrap: 5
  light-switch: false
  bslib:
    preset: bootstrap
    bg: "#191919"
    fg: "#deeeed"
    primary: "#7788aa"
    secondary: "#789978"
    success: "#789978"
    info: "#7788aa"
    warning: "#abab77"
    danger: "#d70000"
    body-bg: "#191919"
    body-color: "#deeeed"
    border-color: "#333333"
    link-color: "#7788aa"
    link-hover-color: "#789978"
    base_font: {google: "Open Sans"}
    heading_font: {google: "Open Sans"}
    code_font: {google: "JetBrains Mono"}
    font-size-base: "1rem"
    line-height-base: 1.75
    navbar-bg: "#191919"
    pkgdown-nav-height: 56px

navbar:
  bg: dark

reference:
- title: "MCP Core Functions"
  desc: >
    Core functions for creating and managing MCP server objects
  contents:
    - new_mcp
    - add_capability
    - register_mcpr_tools

- title: "Capability Creation"
  desc: >
    Functions for creating different types of capabilities
  contents:
    - new_tool
    - new_resource
    - new_prompt

- title: "Schema and Properties"
  desc: >
    Functions for defining input schemas and properties
  contents:
    - schema
    - properties
    - property_string
    - property_number
    - property_boolean
    - property_array
    - property_object
    - property_enum
    - new_property

- title: "Server Functions"
  desc: >
    Functions for serving MCP implementations
  contents:
    - serve_io
    - serve_http
    - get_name

- title: "Client Functions"
  desc: >
    Functions for connecting to and interacting with MCP servers
  contents:
    - new_client_io
    - new_client_http
    - initialize
    - tools_list
    - tools_call
    - prompts_list
    - prompts_get
    - resources_list
    - resources_read
    - read
    - write

- title: "Response Functions"
  desc: >
    Functions for creating various response types
  contents:
    - response
    - matches("^response_")

- title: "Roxygen2 Extension"
  desc: >
    Functions for extending roxygen2 with MCP server generation
  contents:
    - mcp_roclet
    - roxy_tag_parse.roxy_tag_mcp
    - roxy_tag_parse.roxy_tag_type
    - roclet_process.roclet_mcp
    - roxy_tag_rd.roxy_tag_mcp
    - roxy_tag_rd.roxy_tag_type
    - roclet_output.roclet_mcp

- title: "Ellmer Integration"
  desc: >
    Functions for integrating with the Ellmer package
  contents:
    - register_mcpr_tools
    - ellmer_to_mcpr_tool

